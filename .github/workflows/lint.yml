name: Lint

on:
  push:
  pull_request:
    branches:
      - trunk

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - run: uv python install

      - run: uv run ruff check --output-format=github .

      - run: uv run ruff format --check --output-format=github
